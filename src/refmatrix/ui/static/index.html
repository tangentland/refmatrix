<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>refmatrix hub</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">rmx<span>hub</span></div>
    <div class="omnibox">
      <input id="omni" type="text" placeholder="where are my keys?  ·  search across everything"
             autocomplete="off" spellcheck="false">
      <div id="omni-results" class="omni-results hidden"></div>
    </div>
    <div id="hub-state" class="hub-state">…</div>
  </header>

  <nav id="tabs">
    <button data-tab="projects" class="active">Projects</button>
    <button data-tab="graph">Graph</button>
    <button data-tab="ops">Ops</button>
    <button data-tab="health">Health</button>
    <button data-tab="usage">Usage</button>
    <button data-tab="memory">Memory</button>
    <button data-tab="bus">Bus</button>
    <button data-tab="focus">Focus</button>
  </nav>

  <main>
    <section id="tab-projects" class="tab active"></section>

    <section id="tab-graph" class="tab">
      <div class="graph-bar">
        <select id="graph-project"></select>
        <input id="graph-ref" type="text" placeholder="symbol / concept / phrase">
        <label class="degree">degree
          <select id="graph-degree">
            <option value="0">0</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
        <button id="graph-go">explore</button>
        <label class="degree"><input type="checkbox" id="graph-tests"> include tests</label>
        <span class="hint">click=select · dbl-click=refocus · right-click code/doc=view file</span>
      </div>
      <div class="graph-crumbs" id="graph-crumbs"></div>
      <div class="graph-wrap">
        <canvas id="graph-canvas"></canvas>
        <aside id="node-panel" class="node-panel hidden"></aside>
        <div id="graph-landing" class="graph-landing">
          <div class="landing-toggle">
            <button data-view="top" class="active">top concepts</button>
            <button data-view="tree">project files</button>
          </div>
          <div id="landing-body" class="landing-body"></div>
        </div>
      </div>
    </section>

    <section id="tab-ops" class="tab"></section>
    <section id="tab-health" class="tab"></section>
    <section id="tab-usage" class="tab"></section>
    <section id="tab-memory" class="tab"></section>
    <section id="tab-bus" class="tab"></section>
    <section id="tab-focus" class="tab"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>

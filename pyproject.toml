[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refmatrix"
version = "0.3.20"
description = "Roaring-bitmap reference matrix for documents, code, and concepts. Hyper-tldr index."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "tholley"}]
dependencies = [
    "pyroaring>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "duckdb>=1.5.3",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
tldr = ["llm-tldr>=1.5"]
watch = ["watchdog>=4.0"]
dense = [
    "pylance>=0.20",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
dev = ["pytest>=8.0", "watchdog>=4.0"]

[project.scripts]
refmatrix = "refmatrix.cli:cli_entry"
rmx = "refmatrix.cli:cli_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refmatrix = ["templates/agents/*.md"]

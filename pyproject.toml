[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refmatrix"
version = "0.84.0"
description = "Roaring-bitmap reference matrix for documents, code, and concepts. Hyper-tldr index."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "tholley"}]
dependencies = [
    "pyroaring>=1.0",
    "click>=8.1",
    "rich>=13.7",
    # Storage-format libraries are capped below their next major (Q47 = d, 2026-11-15): a major
    # can change or refuse the on-disk catalog, so it is a planned, tested upgrade, never a stray
    # resolve. Everything else keeps a floor only; requirements.lock records what production runs.
    "duckdb>=1.5.3,<2",
    "pyarrow>=14.0",
    # Embeddings + ANN: the daemon always embeds on sync, so these are
    # core, not optional.
    "pylance>=6,<7",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    # File watcher: the daemon watches by default (--no-watch opts out).
    "watchdog>=4.0",
    # Pulled transitively by transformers/lance/jinja2, but pinned here so a
    # standalone venv install never lands them in a system/Framework path
    # instead of the venv (the split that broke imports before).
    "typing_extensions>=4.0",
    "markupsafe>=2.0",
]

[project.optional-dependencies]
tldr = ["llm-tldr>=1.5"]
# pytest-timeout is the suite's hang guard (task-29.4 #r2): scripts/ptest.py refuses to run
# without it rather than run unguarded (ruling L192 (6), 2026-11-23).
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-timeout>=2.4"]
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
refmatrix = "refmatrix.cli:cli_entry"
rmx = "refmatrix.cli:cli_entry"

[tool.pytest.ini_options]
# task-29.4 #r1-fixtures / #r2 (29.4a, 2026-11-23). norecursedirs REPLACES pytest's default list,
# so the defaults are repeated (".*" keeps .venv-eval/ and .refmatrix/ out) and two are added:
# tests/fixtures/ holds fixture suites that fail, error and leak on purpose, and
# tests/sandbox_site/ is the sandbox's sitecustomize, not a test package. bug-299: a fixture
# named `*_test.py` (pytest's second default file pattern) broke the plain collection.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv",
                 "{arch}", "fixtures", "sandbox_site"]
# The hang guard, not a speed check: `signal` raises inside the test, so teardown and the
# session-finish reaper still run (feedback_mutation_must_fail_not_hang).
timeout = 600
timeout_method = "signal"

[tool.setuptools]
# rmxgrep is POSIX shell, not a console_script: alias grep=rmxgrep must not
# pay python startup on every invocation outside a project.
script-files = ["bin/rmxgrep", "bin/rmxrg"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refmatrix = [
    "templates/agents/*.md",
    "templates/commands/*.md",
    "ui/static/*",
    "ui/static/**/*",
]
